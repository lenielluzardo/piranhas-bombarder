<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piranhas Bombarder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <canvas id="canvas1"></canvas>
  <!-- characters -->
  <img id="player" class="character env-img" src="assets/player.png" alt="">
  <img id="angler1" class="character env-img" src="assets/angler1.png" alt="">
  <img id="angler2" class="character env-img" src="assets/angler2.png" alt="">
  <img id="lucky" class="character env-img" src="assets/lucky.png" alt="">
  <img id="hivewhale" class="character env-img" src="assets/hivewhale.png" alt="">
  <img id="bulbwhale" class="character env-img" src="assets/bulbwhale.png" alt="">
  <img id="drone" class="character env-img" src="assets/drone.png" alt="">
  <img id="moonfish" class="character env-img" src="assets/moonfish.png" alt="">
  <img id="stalker" class="character env-img" src="assets/stalker.png" alt="">
  <img id="razorfin" class="character env-img" src="assets/razorfin.png" alt="">

  <!-- props -->
  <img id="projectile" class="env-img" src="assets/projectile.png" alt="">
  <img id="gears" class="env-img" src="assets/gears.png" alt="">
  <img id="smokeExplosion" class="env-img" src="assets/smokeExplosion.png" alt="">
  <img id="fireExplosion" class="env-img" src="assets/fireExplosion.png" alt="">
  <img id="shield" class="env-img" src="assets/shield.png" alt="">
  <img id="fireball" class="env-img" src="assets/fireball.png" alt="">

  <!-- environment -->
  <img id="layer1" class="env-img" src="assets/layer1.png" alt="">
  <img id="layer2" class="env-img" src="assets/layer2.png" alt="">
  <img id="layer3" class="env-img" src="assets/layer3.png" alt="">
  <img id="layer4" class="env-img" src="assets/layer4.png" alt="">

  <!-- audio effects -->
  <audio id="powerup" src="assets/powerup.wav" ></audio>
  <audio id="powerdown" src="assets/powerdown.wav" ></audio>
  <audio id="explosion" src="assets/explosion.wav" ></audio>
  <audio id="hit" src="assets/hit.wav" ></audio>
  <audio id="shieldSound" src="assets/shield.wav" ></audio>
  <audio id="shot" src="assets/shot.wav" ></audio>

  <!-- scripts -->
  <script type="module" src="main.js"></script>

</body>

</html>
